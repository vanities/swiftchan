name: Build and Test

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TEST_DEVICE: iPhone 17

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.6-spm-${{ hashFiles('swiftchan.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve locked dependencies
        run: >-
          xcodebuild -resolvePackageDependencies
          -workspace swiftchan.xcworkspace -scheme swiftchan
          -clonedSourcePackagesDirPath build/SourcePackages
          -onlyUsePackageVersionsFromResolvedFile

      - name: Verify Xcode Cloud package lockfile
        run: |
          cmp swiftchan.xcworkspace/xcshareddata/swiftpm/Package.resolved swiftchan.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -resolvePackageDependencies -workspace swiftchan.xcodeproj/project.xcworkspace -scheme swiftchan -clonedSourcePackagesDirPath build/SourcePackages -onlyUsePackageVersionsFromResolvedFile

      - name: Build and test
        run: bundle exec fastlane tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: fastlane/test_output/
          if-no-files-found: ignore
